{% extends 'professor/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Create Quiz for {{ course.name }}</h2>
    <form method="POST">
        <div class="form-group">
            <label for="title">Quiz Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label for="total_marks">Total Marks</label>
            <input type="number" class="form-control" id="total_marks" name="total_marks" value="100" min="1" required>
        </div>
        <div class="form-group">
            <label for="duration">Duration (minutes)</label>
            <input type="number" class="form-control" id="duration" name="duration" value="30" min="1" required>
        </div>
        <div class="form-group">
            <label for="start_time">Start Time</label>
            <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
        </div>
        <div class="form-group">
            <label for="end_time">End Time</label>
            <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
        </div>
        <div class="form-group">
            <label for="weight">Weight (as a percentage of course grade)</label>
            <input type="number" class="form-control" id="weight" name="weight" value="1.0" step="0.01" min="0">
        </div>
        <button type="submit" class="btn btn-primary">Create Quiz</button>
        <a href="{{ url_for('professor.course_details', course_id=course.id) }}" class="btn btn-secondary ml-2">Cancel</a>
    </form>
</div>
{% endblock %}
