{% extends "admin/base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card mb-4 shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <i class="fas fa-user-shield fa-6x text-primary"></i>
                    </div>
                    <h3 class="card-title mb-0">{{ current_user.first_name }} {{ current_user.last_name }}</h3>
                    <p class="text-muted mb-2">{{ current_user.username }}</p>
                    <p class="text-muted">{{ current_user.email }}</p>
                    <span class="badge bg-success">Admin</span>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Profile Information</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin.admin_profile') }}">
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">First Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="first_name" value="{{ current_user.first_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Last Name</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" name="last_name" value="{{ current_user.last_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Email</label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Username</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">Last Login</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" value="{{ current_user.last_login.strftime('%Y-%m-%d %H:%M') if current_user.last_login else 'Never' }}" disabled>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Change Password</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin.change_admin_password') }}">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label">Current Password</label>
                            <div class="col-sm-8">
                                <input type="password" class="form-control" name="current_password" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label">New Password</label>
                            <div class="col-sm-8">
                                <input type="password" class="form-control" name="new_password" required>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label">Confirm New Password</label>
                            <div class="col-sm-8">
                                <input type="password" class="form-control" name="confirm_new_password" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-secondary">Change Password</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Admin Preferences</div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin.update_admin_preferences') }}">
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label">Receive System Alerts</label>
                            <div class="col-sm-8">
                                <input type="checkbox" name="receive_alerts" {% if current_user.receive_alerts %}checked{% endif %}>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label class="col-sm-4 col-form-label">Enable 2FA</label>
                            <div class="col-sm-8">
                                <input type="checkbox" name="enable_2fa" {% if current_user.enable_2fa %}checked{% endif %}>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-info">Save Preferences</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Account Actions</div>
                <div class="card-body text-end">
                    <form method="POST" action="{{ url_for('admin.logout_other_sessions') }}" class="d-inline">
                        <button type="submit" class="btn btn-outline-warning">Logout Other Sessions</button>
                    </form>
                    <form method="POST" action="{{ url_for('admin.delete_admin_account') }}" class="d-inline ms-2" onsubmit="return confirm('Are you sure you want to delete your admin account? This action cannot be undone.');">
                        <button type="submit" class="btn btn-outline-danger">Delete Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
