{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Edit Course</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="code" class="form-label">Course Code</label>
                            <input type="text" class="form-control" id="code" name="code" value="{{ course.code }}" required>
                            <div class="form-text">A unique identifier for the course (e.g., CS101, MATH201)</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">Course Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ course.name }}" required>
                            <div class="form-text">The full name of the course</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ course.description }}</textarea>
                            <div class="form-text">A brief description of the course</div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col">
                                <label for="credits" class="form-label">Credits</label>
                                <input type="number" class="form-control" id="credits" name="credits" value="{{ course.credits }}" required min="1" max="6">
                            </div>
                            <div class="col">
                                <label for="semester" class="form-label">Semester</label>
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="Fall 2024" {% if course.semester == 'Fall 2024' %}selected{% endif %}>Fall 2024</option>
                                    <option value="Spring 2025" {% if course.semester == 'Spring 2025' %}selected{% endif %}>Spring 2025</option>
                                    <option value="Summer 2025" {% if course.semester == 'Summer 2025' %}selected{% endif %}>Summer 2025</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="program_id" class="form-label">Program</label>
                            <select class="form-select" id="program_id" name="program_id" required>
                                <option value="">Select a program...</option>
                                {% for program in programs %}
                                <option value="{{ program.id }}" {% if course.program_id == program.id %}selected{% endif %}>
                                    {{ program.name }} ({{ program.code }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="professor_id" class="form-label">Professor</label>
                            <select class="form-select" id="professor_id" name="professor_id">
                                <option value="">Select a professor...</option>
                                {% for professor in professors %}
                                <option value="{{ professor.id }}" {% if course.professor_id == professor.id %}selected{% endif %}>
                                    {{ professor.first_name }} {{ professor.last_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update Course</button>
                            <a href="{{ url_for('admin.courses') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const codeInput = document.getElementById('code');
    codeInput.addEventListener('input', function() {
        this.value = this.value.toUpperCase();
    });
});
</script>
{% endblock %}
