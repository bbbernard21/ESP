{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Edit User</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password">
                            <div class="form-text">Leave blank to keep current password</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" name="role" required onchange="toggleProgramField()">
                                {% for role in roles %}
                                <option value="{{ role }}" {% if user.role == role %}selected{% endif %}>
                                    {{ role|title }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3" id="program_field" style="display: '{{ 'block' if user.role == 'student' else 'none' }}';">
                            <label for="program_id" class="form-label">Program</label>
                            <select class="form-select" id="program_id" name="program_id" {{ 'required' if user.role == 'student' }}>
                                <option value="">Select a program...</option>
                                {% for program in programs %}
                                <option value="{{ program.id }}" {% if user.program_id == program.id %}selected{% endif %}>
                                    {{ program.code }} - {{ program.name }}
                                </option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Required for students. Changing the program will update the student's course enrollments.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Update User</button>
                            <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleProgramField() {
    const roleSelect = document.getElementById('role');
    const programField = document.getElementById('program_field');
    const programSelect = document.getElementById('program_id');
    
    if (roleSelect.value === 'student') {
        programField.style.display = 'block';
        programSelect.required = true;
    } else {
        programField.style.display = 'none';
        programSelect.required = false;
        programSelect.value = '';
    }
}
</script>
{% endblock %}
